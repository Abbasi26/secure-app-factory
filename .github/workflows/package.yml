# Builds the two example apps and runs the offline demo.
# Intune upload is off unless a manual run sets upload=true and the SAF_INTUNE_* secrets exist.
# -IncludeToolkit downloads the pinned PSAppDeployToolkit 4.1.8 template (LGPL-3.0-or-later).
# -DownloadContentPrepTool downloads Microsoft Win32 Content Prep Tool 1.8.7.
# Running this workflow means the operator accepts that tool's Microsoft license terms:
# https://github.com/microsoft/Microsoft-Win32-Content-Prep-Tool/blob/v1.8.7/Microsoft%20License%20Terms%20For%20Win32%20Content%20Prep%20Tool.pdf

name: Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: Publish each built Win32 app to Intune. Requires all three SAF_INTUNE_* secrets. Does not create an assignment.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Pester (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu pwsh 7.6 LTS
            os: ubuntu-latest
            pwsh: '7.6.10'
            sha256-linux: e261cabc91c78a9afe8d1e5f24731ab0d38204735ab2ec94b0af55102652e10d
            sha256-windows: 7d871531806eb1646264e4bbabd9f0c30c23355591bc756bb9909448c29ae166
          - name: ubuntu pwsh 7.7
            os: ubuntu-latest
            pwsh: '7.7.0'
            sha256-linux: c89d9c682d2c403dfe726f3df948e359675235a5bd6fab535776de69729ca0cb
            sha256-windows: 7c74e03b20a75b59715847439d046a6214b1863ee79b187872980f139bb4a05f
          - name: windows pwsh 7.6 LTS
            os: windows-latest
            pwsh: '7.6.10'
            sha256-linux: e261cabc91c78a9afe8d1e5f24731ab0d38204735ab2ec94b0af55102652e10d
            sha256-windows: 7d871531806eb1646264e4bbabd9f0c30c23355591bc756bb9909448c29ae166
          - name: windows pwsh 7.7
            os: windows-latest
            pwsh: '7.7.0'
            sha256-linux: c89d9c682d2c403dfe726f3df948e359675235a5bd6fab535776de69729ca0cb
            sha256-windows: 7c74e03b20a75b59715847439d046a6214b1863ee79b187872980f139bb4a05f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install PowerShell ${{ matrix.pwsh }}
        uses: $/.github/actions/install-pwsh
        with:
          version: ${{ matrix.pwsh }}
          sha256-linux: ${{ matrix.sha256-linux }}
          sha256-windows: ${{ matrix.sha256-windows }}
      - name: Install Pester 5 and run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $installed = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' } | Select-Object -First 1
          if (-not $installed) {
            Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force
          }
          ./scripts/Invoke-Tests.ps1

  test-windows-powershell:
    name: Pester (windows powershell 5.1)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Pester 5 and run tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $installed = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' } | Select-Object -First 1
          if (-not $installed) {
            Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          ./scripts/Invoke-Tests.ps1

  catalog:
    name: Catalog check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install PowerShell 7.6 LTS
        uses: $/.github/actions/install-pwsh
      - name: Check every apps/<id> offline
        shell: pwsh
        run: ./scripts/Test-Apps.ps1 -SummaryPath $env:GITHUB_STEP_SUMMARY

  demo:
    name: Offline demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install PowerShell 7.6 LTS
        uses: $/.github/actions/install-pwsh
      - name: Run the mocked pipeline
        shell: pwsh
        run: ./demo/Invoke-Demo.ps1 -Destination "${{ github.workspace }}/demo-output"
      - name: Upload demo reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-reports
          path: demo-output/**/REPORT.md
          if-no-files-found: error

  package:
    name: Package ${{ matrix.app }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [7zip, notepadpp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install PowerShell 7.6 LTS
        uses: $/.github/actions/install-pwsh
      - name: Fetch, verify, wrap, package, and smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = '${{ matrix.app }}'
          $destination = Join-Path $env:GITHUB_WORKSPACE "out/$app"
          ./scripts/Invoke-Package.ps1 -App $app -Destination $destination -IncludeToolkit -DownloadContentPrepTool -SmokeTest -SmokeTestMode Command -Force
          $report = Join-Path $destination 'REPORT.md'
          $packages = @(Get-ChildItem -LiteralPath (Join-Path $destination 'intunewin') -Filter '*.intunewin' -ErrorAction SilentlyContinue)
          if (-not (Test-Path -LiteralPath $report)) { throw "REPORT.md was not written for $app." }
          if ($packages.Count -lt 1) { throw "No .intunewin file was written for $app." }
      - name: Add the package report to the job summary
        if: always()
        shell: pwsh
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE "out/${{ matrix.app }}/REPORT.md"
          if (Test-Path -LiteralPath $report) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (Get-Content -Raw -LiteralPath $report)
          }
      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.app }}
          path: out/${{ matrix.app }}
          if-no-files-found: error

  intune-upload:
    name: Upload ${{ matrix.app }}
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [7zip, notepadpp]
    env:
      SAF_INTUNE_TENANT_ID: ${{ secrets.SAF_INTUNE_TENANT_ID }}
      SAF_INTUNE_CLIENT_ID: ${{ secrets.SAF_INTUNE_CLIENT_ID }}
      SAF_INTUNE_CLIENT_SECRET: ${{ secrets.SAF_INTUNE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install PowerShell 7.6 LTS
        uses: $/.github/actions/install-pwsh
      - name: Rebuild the verified package and upload it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = '${{ matrix.app }}'
          $destination = Join-Path $env:GITHUB_WORKSPACE "out/$app"
          ./scripts/Invoke-Package.ps1 -App $app -Destination $destination -IncludeToolkit -DownloadContentPrepTool -Upload -Force
